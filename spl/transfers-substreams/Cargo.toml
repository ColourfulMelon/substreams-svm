[package]
name = "spl-transfers-substreams"
description = "Substreams wrapper over the native spl-transfers projector"
edition = { workspace = true }
version = "0.1.0"
license = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
spl-transfers = { path = "../transfers" }
buffa = { version = "0.9.2", default-features = false, features = ["std"] }
substreams = "0.8.0"
substreams-solana = { package = "substreams-solana-core", version = "0.16.0" }

[dev-dependencies]
flate2 = "1"
sha2 = "0.10"
