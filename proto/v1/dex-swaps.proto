syntax = "proto3";

package dex.swaps.v1;

enum Protocol {
  PROTOCOL_UNSPECIFIED = 0;
  PROTOCOL_BOOP = 1;
  PROTOCOL_DARKLAKE = 2;
  PROTOCOL_DUMPFUN = 3;
  PROTOCOL_JUPITER_V4 = 4;
  PROTOCOL_JUPITER_V6 = 5;
  PROTOCOL_METEORA_DAAM = 6;
  PROTOCOL_METEORA_DLMM = 7;
  PROTOCOL_ORCA_WHIRLPOOL = 8;
  PROTOCOL_PUMPFUN = 9;
  PROTOCOL_PUMPFUN_AMM = 10;
  PROTOCOL_RAYDIUM_AMM_V4 = 11;
  PROTOCOL_RAYDIUM_CLMM = 12;
  PROTOCOL_RAYDIUM_CPMM = 13;
  PROTOCOL_RAYDIUM_LAUNCHPAD = 14;
  PROTOCOL_METEORA_AMM = 15;
  PROTOCOL_BYREAL = 16;
  PROTOCOL_MOONSHOT = 17;
  PROTOCOL_PANCAKESWAP = 18;
  PROTOCOL_SPL_TOKEN_SWAP = 19;
  PROTOCOL_OKX_DEX = 20;
  PROTOCOL_GOONFI_V2 = 21;
  PROTOCOL_BISONFI = 22;
  PROTOCOL_MANIFEST = 23;
  PROTOCOL_HUMIDIFI = 24;
  PROTOCOL_ORCA_V2 = 25;
  PROTOCOL_ALPHAQ = 26;
  PROTOCOL_KIPSELI = 27;
  PROTOCOL_FLUX = 28;
  PROTOCOL_SCORCH = 29;
  PROTOCOL_OBSIDIAN = 30;
  PROTOCOL_TESSERAV = 31;
  PROTOCOL_DERIVERSE = 32;
  PROTOCOL_ZEROFI = 33;
  PROTOCOL_METEORA_DBC = 34;
  PROTOCOL_FLUXBEAM = 35;
  PROTOCOL_POSEIDON_V2 = 36;
  PROTOCOL_DENALI = 37;
  PROTOCOL_AQUIFER = 38;
  PROTOCOL_BISONFI_PREDICT = 39;
  PROTOCOL_SOLFI_V2 = 40;
  PROTOCOL_SAROS = 41;
  PROTOCOL_PLASMA = 42;
  PROTOCOL_BONKSWAP = 43;
  PROTOCOL_HEAVEN = 44;
  PROTOCOL_STABBLE = 45;
  PROTOCOL_DEFITUNA = 46;
  PROTOCOL_INVARIANT = 47;
  PROTOCOL_ONEDEX = 48;
  PROTOCOL_JUPITER_RFQ = 49;
  PROTOCOL_PHOENIX = 50;
  PROTOCOL_OPENBOOK_V2 = 51;
}

message Events {
  repeated Transaction transactions = 1;
  uint64 parent_slot = 2;
  string parent_hash = 3;
}

message Transaction {
  bytes signature = 1;
  bytes fee_payer = 2;
  repeated bytes signers = 3;
  uint64 fee = 4;
  uint64 compute_units_consumed = 5;
  repeated Swap swaps = 6;
  // Position in the source block, before filtering votes or unsuccessful txs.
  optional uint32 source_index = 7;
  repeated Swap rejected_swaps = 8;
  // Diagnostic candidates are never financial swaps or pricing evidence.
  repeated CoverageCandidate coverage_candidates = 9;
  // Original successful transaction, retained only for diagnostic candidates.
  bytes coverage_transaction = 10;
}

message CoverageCandidate {
  bytes program_id = 1;
  uint32 source_index = 2;
  uint32 stack_height = 3;
  bytes instruction_tag = 4;
  repeated bytes mints = 5;
  uint32 transfer_count = 6;
  string reason = 7;
}

message Swap {
  Protocol protocol = 1;
  bytes program_id = 2;
  uint32 stack_height = 3;
  bytes amm = 4;
  // Actual AMM pool, orderbook market, or RFQ maker account.
  // RFQ maker identities are distinguished by PROTOCOL_JUPITER_RFQ; each
  // token pair remains separate in price aggregates.
  bytes amm_pool = 5;
  bytes user = 6;
  bytes input_mint = 7;
  uint64 input_amount = 8;
  bytes output_mint = 9;
  uint64 output_amount = 10;
  // Position in the transaction's complete instruction walk, before filtering.
  optional uint32 source_index = 11;
  optional uint32 source_transfer_index = 12;
  bool transfer_verified = 13;
  string verification_failure = 14;
  // Actual fills proven by completed native orderbook events and market metadata.
  // Such fills may settle exchange balances without an SPL token transfer.
  bool orderbook_fill_verified = 15;
  // Position of the signed event-log instruction, separate from Token CPIs.
  optional uint32 source_event_index = 16;
  // Position in runtime log_messages; distinct from compiled instruction positions.
  optional uint32 source_log_index = 17;
}

// Deterministic mint metadata, separate from financial swap events.
message TokenFeeUpdates {
  repeated TokenFeeUpdate changes = 1;
}

message TokenFeeUpdate {
  uint64 ordinal = 1;
  bytes mint = 2;
  bytes change = 3;
}
