[package]
name = "dex-swaps"
description = "Normalized DEX swaps"
edition = { workspace = true }
version = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["substreams"]
# Preserve the existing WASM entry point and logging by default. Native callers
# disable this feature to avoid linking Substreams allocator exports.
substreams = ["dep:substreams", "common/substreams"]

[dependencies]
common = { path = "../common", default-features = false }
substreams = { workspace = true, optional = true }
substreams-solana = { package = "substreams-solana-core", version = "0.16.0" }
anyhow = "1"
log = "0.4"
substreams-solana-idls = { workspace = true }
proto = { path = "../proto" }
# Complete-block structural validation shared with the SPL transfer projector.
spl-transfers = { path = "../spl/transfers" }

[dev-dependencies]
base64 = "0.22.1"
borsh = "1"
solana-program = "2.3.0"

[dev-dependencies.flate2]
version = "1"

[dev-dependencies.buffa]
workspace = true

[dev-dependencies.sha2]
version = "0.10"
