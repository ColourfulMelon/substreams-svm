[package]
name = "dex-swaps"
description = "Normalized DEX swaps"
edition = { workspace = true }
version = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
common = { path = "../common" }
substreams = { workspace = true }
substreams-solana = { workspace = true }
substreams-solana-idls = { workspace = true }
proto = { path = "../proto" }

[dev-dependencies]
base64 = "0.22.1"
borsh = "1"
solana-program = "2.3.0"

# Complete-block structural validation; pending upstream PR #225. This pin is
# independent of the decoder behavior fixes in PRs #223 and #224.
[dependencies.spl-transfers]
git = "https://github.com/pinax-network/substreams-svm"
rev = "3de4050e4bd6febfeca526281181d1ec3e23307c"

[dev-dependencies.flate2]
version = "1"

[dev-dependencies.prost]
workspace = true

[dev-dependencies.sha2]
version = "0.10"
