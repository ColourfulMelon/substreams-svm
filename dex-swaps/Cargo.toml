[package]
name = "dex-swaps"
description = "Normalized DEX swaps"
edition = { workspace = true }
version = { workspace = true }

[features]
default = ["metadata-handlers"]
metadata-handlers = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
common = { path = "../common" }
substreams = { workspace = true }
substreams-solana = { workspace = true }
substreams-solana-idls = { workspace = true }
proto = { path = "../proto" }
base64 = "0.22.1"
solana-pubkey = { version = "2.4.0", features = ["curve25519"] }

[dev-dependencies]
borsh = "1"
solana-program = "2.3.0"
