[package]
name = "common"
description = { workspace = true }
edition = { workspace = true }
version = { workspace = true }

[lib]
crate-type = ["rlib"]

[features]
default = ["substreams"]
# Existing Substreams consumers retain the database, Clock and scalar helpers.
# Native decoders can use the model and pure helpers without the WASM runtime.
substreams = ["dep:substreams", "dep:substreams-database-change"]

[dependencies]
substreams = { workspace = true, optional = true }
substreams-solana = { package = "substreams-solana-core", version = "0.16.0" }
substreams-database-change = { workspace = true, optional = true }
buffa = { workspace = true }
buffa-types = { workspace = true }
proto = { path = "../proto" }
base64 = "0.22.1"
